server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The SPA calls /api on its own origin. Forward that prefix to the Spring
    # Boot service so the production Compose stack behaves like the Vite dev
    # server, which proxies /api to localhost:8080.
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # Vue Router uses history mode; unknown paths must return the SPA shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
