services:
  # 1. PostgreSQL database
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lms_dev_only}
      POSTGRES_DB: ${POSTGRES_DB:-lms}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Redis cache
  redis:
    image: redis:alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 3. Spring Boot backend.
  #    Deliberately behind the "full" profile: backend/pom.xml and the Maven
  #    wrapper are delivered by T-30-02 (issue #75), so the image cannot be
  #    built yet. Until then, `docker compose up -d` starts the database, the
  #    cache and the frontend only. Once T-30-02 lands, use:
  #        docker compose --profile full up -d
  backend:
    profiles: ["full"]
    build:
      context: ./backend
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-lms}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-lms}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-lms_dev_only}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # 4. Vue frontend, built by Vite and served by Nginx
  frontend:
    build:
      context: ./frontend
      args:
        # Consumed by Vite at build time. R4 sets the final value in issue #82;
        # /api matches the OpenAPI server path, with Nginx proxying to backend.
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    ports:
      - "${FRONTEND_PORT:-80}:80"

volumes:
  postgres_data: